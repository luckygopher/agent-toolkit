name: Native runtime

on:
  push:
    branches-ignore: [marketplace]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Native behavior and race tests
        run: go test -race ./...
      - name: Build packaged host runtime
        run: python scripts/build_plugins.py --plugin image-gen --host-only
      - name: Independent install and no-interpreter tests
        run: python -m unittest discover -s tests -v

  publish:
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Build all six platforms
        run: python scripts/build_plugins.py --plugin image-gen
      - name: Publish prebuilt marketplace and immutable runtime tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git --hostname github.com
          python scripts/publish_marketplace.py --push
